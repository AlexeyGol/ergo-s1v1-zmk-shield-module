# Smoke test: create an issue in the pipeline and assign it to the Copilot coding agent.
#
# SETUP REQUIRED (one-time):
#   The built-in GITHUB_TOKEN (and GitHub App tokens) CANNOT assign the Copilot
#   coding agent — the assignment API deliberately rejects them, so
#   `suggestedActors` returns no `copilot-swe-agent` and the assign step fails with
#   "Copilot is not available as an assignee". You must use a user Personal Access
#   Token (PAT) belonging to a user who has Copilot coding agent access on this repo.
#
#   1. Enable the Copilot coding agent: repo Settings > Copilot > Coding agent.
#   2. Create a fine-grained PAT (github.com > Settings > Developer settings >
#      Fine-grained tokens), scoped to THIS repository, with:
#        - Repository permissions > Issues: Read and write
#            (covers create / view / assign / close)
#        - Repository permissions > Metadata: Read-only  (auto-required; used by the
#            suggestedActors and issue-node-id GraphQL lookups)
#      There is no "Copilot" scope — what matters is that it's a USER PAT and the
#      user has Copilot access.
#   3. Add the token as a repo secret named COPILOT_ASSIGN_PAT
#      (Settings > Secrets and variables > Actions).
#
# Note: PATs are tied to a user and expire. Fine for a throwaway test; for a
# permanent workflow prefer a GitHub App with a token-exchange step.

name: Temporary Test Box

on:
  push:
    # branches-ignore:
    #   - qa
    #   - prod
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAX: 5

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      # Default token handles create / view / close (scoped by permissions: above).
      # The PAT is added only on the assign step that needs it (see that step).
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create test issue body
        run: |
          cat << 'EOF' > issue-body.md
          # Test Issue - Copilot Agent Assignment

          This is a **dummy test issue** created to verify:
          1. Issue creation via `gh issue create`
          2. Copilot coding-agent resolution via GraphQL
          3. Copilot assignment via `replaceActorsForAssignable` mutation

          Auto-generated by `tmp_testbox.yml`. Safe to close.
          EOF

      - name: Create tracking issue
        id: issue
        run: |
          #TBD - mb assign a label?b
          URL=$(gh issue create \
            --title "Test: Copilot agent assignment smoke-test ($(date +%Y-%m-%d))" \
            --body-file issue-body.md \
            --repo "${{ github.repository }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "number=$(basename "$URL")" >> "$GITHUB_OUTPUT"
          echo "Created issue: $URL"

      - name: Read back issue title
        run: |
          NUM="${{ steps.issue.outputs.number }}"
          TITLE=$(gh issue view "$NUM" --repo "${{ github.repository }}" --json title --jq '.title')
          echo "Issue #$NUM title: $TITLE"

      - name: Assign the issue to Copilot (GraphQL)
        env:
          # User PAT — the Copilot assignment API rejects the default GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_PAT }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${GITHUB_REPOSITORY#*/}"
          NUM="${{ steps.issue.outputs.number }}"

          # 1) Resolve the Copilot coding agent actor id (login: copilot-swe-agent)
          COPILOT_ID=$(gh api graphql \
            -H "GraphQL-Features: issues_copilot_assignment_api_support" \
            -f query='
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 100) {
                    nodes { login __typename ... on Bot { id } ... on User { id } }
                  }
                }
              }' \
            -F owner="$OWNER" -F repo="$REPO" |
            jq -r '.data.repository.suggestedActors.nodes[] | select(.login == "copilot-swe-agent") | .id')

          if [ -z "$COPILOT_ID" ]; then
            echo "::error::Copilot is not available as an assignee. Confirm the Copilot coding agent is enabled."
            exit 1
          fi
          echo "Resolved copilot-swe-agent ID: $COPILOT_ID"

          # 2) Resolve the issue node id
          ISSUE_ID=$(gh api graphql \
            -f query='
              query($owner: String!, $repo: String!, $num: Int!) {
                repository(owner: $owner, name: $repo) { issue(number: $num) { id } }
              }' \
            -F owner="$OWNER" -F repo="$REPO" -F num="$NUM" |
            jq -r '.data.repository.issue.id')
          echo "Resolved issue node ID: $ISSUE_ID"

          # 3) Assign Copilot -> triggers the coding agent
          gh api graphql \
            -H "GraphQL-Features: issues_copilot_assignment_api_support" \
            -f query='
              mutation($assignable: ID!, $actor: ID!) {
                replaceActorsForAssignable(input: {assignableId: $assignable, actorIds: [$actor]}) {
                  assignable { ... on Issue { number } }
                }
              }' \
            -F assignable="$ISSUE_ID" -F actor="$COPILOT_ID"

          echo "Assigned issue #$NUM to the Copilot coding agent."

      - name: Close test issue
        if: always() && steps.issue.outputs.number != ''
        run: |
          gh issue close "${{ steps.issue.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --comment "Smoke-test complete. Closing automatically."
          echo "Closed issue #${{ steps.issue.outputs.number }}"
