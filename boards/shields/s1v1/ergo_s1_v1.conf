CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=15
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Additional - to test
CONFIG_ZMK_KEYBOARD_NAME="ErgoS1V1" # Bluetooth device name (shows when pairing)

CONFIG_ZMK_HOLD_TAP_MAX_HOLD_TIMEOUT_MS=200 # Max time to wait before deciding a hold-tap is a hold (vs. tap). Shorter = more responsive holds, but harder to trigger on quick taps. Default is 300ms.
# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y # Report battery % over BLE (shows in Windows/macOS tray)

CONFIG_ZMK_IDLE_TIMEOUT=30000 # Go idle after 30s (stops scanning, dims anything visual)

# Power management
  # Deep sleep after 15min idle — draws ~3µA vs ~1mA awake
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y # Boost TX power → better range, slightly more battery use
CONFIG_ZMK_BATTERY_POLL_PERIOD_MS=60000 # Explicit battery poll interval 60000 = 60 seconds, default

CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y # Full media key set (play, pause, volume, brightness, etc.)

# CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1 # How long central waits to reconnect to peripheral on boot (ms)

# Retry peripheral connection more aggressively 
# Without tuning these, the right half can take 3–5 seconds to reconnect after waking from sleep. These cut it to under 1 second.
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6    # 7.5ms — fastest scan interval
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12   # 15ms — max interval
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=0    # don't skip connection events

# CONFIG_ZMK_POINTING=y # Enable pointing device support (trackball, trackpoint, etc.)

# DEBUG
#  - Connect USB, open a serial monitor at 115200 baud, see exactly what firmware is doing.
# CONFIG_ZMK_USB_LOGGING=y # Stream ZMK logs over USB serial — see keypress events, BLE status
  # Wipe all pairings on next boot — useful when re-pairing goes wrong
  # Set to y temporarily, flash, then set back to n
# CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n