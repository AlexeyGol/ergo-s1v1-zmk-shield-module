CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# For split: central (left) fetches and proxies right half battery too
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y                                                                                                  
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# Must be profiles (5) + peripherals (1); ZMK derives profile count as MAX_PAIRED - peripherals
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# ZMK Studio: live remap keys without reflashing (newer ZMK feature)
# CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y # Windows fails to connect on fresh slots; also disables 2M PHY (some Windows BT adapters are picky)
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n # Prevents Windows from dropping BLE connection when it re-subscribes to GATT notifications