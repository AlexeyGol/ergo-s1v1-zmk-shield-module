# peripheral only needs 1 connection (to central)
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# Peripheral has no USB HID role — disable to save flash/RAM
CONFIG_ZMK_USB=n

# More aggressive sleep on peripheral — it's battery-only, never USB-powered
# CONFIG_ZMK_IDLE_TIMEOUT=15000         # 15s idle (vs 30s on left)
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000  # 5min to deep sleep (vs 15min on left)